name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # 1. LINT & CODE QUALITY CHECK (Ruff)
  # ==============================================================================
  lint:
    name: Code Quality & Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  # ==============================================================================
  # 2. UNIT TESTS (Pytest — 100% Mockado, Zero consumo de cota ou rede)
  # Depende exclusivamente da aprovação prévia do Lint
  # ==============================================================================
  unit-tests:
    name: Automated Unit Tests (Pytest)
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      ALPHA_VANTAGE_API_KEY: "dummy_ci_key"
      GCP_PROJECT_ID: "dummy-ci-project"
      BUCKET_BRONZE: "dummy-ci-bucket"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
      AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Airflow Runtime Dependencies
        run: |
          python -c "from importlib.metadata import version; import airflow, cosmos; assert airflow.__version__ == '2.9.3'; assert version('astronomer-cosmos') == '1.8.2'; print('Airflow/Cosmos import OK')"
          python -c "import httpx; client = httpx.Client(); client.close(); print('HTTP client OK')"

      # Render the real Cosmos DAG from the current manifest without cloud access.
      - name: Prepare dbt Manifest for DAG Integrity Tests
        run: |
          dbt deps --project-dir src/transformations --profiles-dir src/transformations
          dbt parse --project-dir src/transformations --profiles-dir src/transformations --target ci

      - name: Check Silver Coverage Against Extraction Contracts
        run: pytest -v tests/test_silver_contracts.py

      - name: Validate Round-Robin Scheduling and API Budget
        run: |
          pytest -v \
            tests/test_round_robin.py \
            tests/test_round_robin_week.py \
            tests/test_orchestration.py \
            tests/test_extractors.py \
            tests/test_api_client.py

      - name: Run Pytest Suite
        run: |
          pytest -v \
            --ignore=tests/test_silver_contracts.py \
            --ignore=tests/test_round_robin.py \
            --ignore=tests/test_round_robin_week.py \
            --ignore=tests/test_orchestration.py \
            --ignore=tests/test_extractors.py \
            --ignore=tests/test_api_client.py

  # ==============================================================================
  # 3. DBT VALIDATION (Parse, Silver/Gold unit tests & data quality)
  # Depende da aprovação dos testes unitários
  # ==============================================================================
  dbt-validation:
    name: dbt Silver and Gold Validation
    concurrency:
      group: dbt-silver-ci
      cancel-in-progress: false
    needs: [unit-tests]
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core>=1.10.5,<2" "dbt-bigquery>=1.10,<2"

      - name: Install dbt Packages
        run: dbt deps --project-dir src/transformations --profiles-dir src/transformations

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Validate dbt Syntax and Project Manifest
        run: dbt parse --project-dir src/transformations --profiles-dir src/transformations --target ci --no-partial-parse

      - name: Prepare CI Dataset for Unit Tests
        run: dbt run-operation prepare_ci_schema --project-dir src/transformations --profiles-dir src/transformations --target ci

      # SQL fixtures mock all inputs; unit tests never read Bronze data.
      - name: Run Silver and Gold Unit Tests
        run: dbt test --select "intermediate,test_type:unit marts,test_type:unit" --project-dir src/transformations --profiles-dir src/transformations --target ci

      # Read existing Bronze external tables; build views and the Gold table in alphavantage_ci.
      # The CI target disables external-table recreation in the production dataset.
      - name: Build Silver and Gold and Run Data Quality Tests
        run: dbt build --select +marts --exclude test_type:unit --project-dir src/transformations --profiles-dir src/transformations --target ci

      - name: Upload dbt Validation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-silver-gold-results
          path: |
            src/transformations/target/manifest.json
            src/transformations/target/run_results.json
            src/transformations/logs/dbt.log
          if-no-files-found: ignore

  # Deployment is not implemented. This job reports validation only.
  release-validation:
    name: Release Validation (No Deployment)
    needs: [lint, unit-tests, dbt-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Report Validation Status
        run: echo "Validation passed. Production deployment is not configured; no deployment was performed." >> "$GITHUB_STEP_SUMMARY"
