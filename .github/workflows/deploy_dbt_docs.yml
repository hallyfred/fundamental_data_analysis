name: Deploy dbt Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy_dbt_docs.yml"
      - "src/transformations/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build dbt Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: python -m pip install "dbt-core==1.10.8" "dbt-bigquery==1.10.3"

      - name: Install dbt Packages
        run: dbt deps --project-dir src/transformations --profiles-dir src/transformations

      - name: Parse Public dbt Manifest
        env:
          GCP_PROJECT_ID: public-docs
          BUCKET_BRONZE: public-docs
        run: >-
          dbt parse
          --no-partial-parse
          --project-dir src/transformations
          --profiles-dir src/transformations
          --target docs
          --target-path target/pages

      - name: Generate Public dbt Docs
        env:
          GCP_PROJECT_ID: public-docs
          BUCKET_BRONZE: public-docs
        run: >-
          dbt docs generate
          --empty-catalog
          --no-compile
          --no-partial-parse
          --project-dir src/transformations
          --profiles-dir src/transformations
          --target docs
          --target-path target/pages

      - name: Prepare Pages Artifact
        run: |
          mkdir -p dbt-docs-site
          cp src/transformations/target/pages/index.html dbt-docs-site/
          cp src/transformations/target/pages/manifest.json dbt-docs-site/
          cp src/transformations/target/pages/catalog.json dbt-docs-site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dbt-docs-site

  deploy:
    name: Deploy dbt Docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
