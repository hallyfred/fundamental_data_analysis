# Ruff formatter and linter settings
line-length = 120
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports and undefined variables)
    "I",   # isort (automatic import ordering)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "S",   # flake8-bandit (security checks)
]
ignore = [
    "E501", # line-too-long (delegated to ruff-format)
    "B008", # do not perform function calls in argument defaults
    "E402", # module import after sys.path bootstrap
]

[lint.isort]
known-first-party = ["src", "config"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # pytest uses assert statements by design

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
