version: 2
models:
- name: stg_overview
  description: Raw OVERVIEW payload and Hive partitions; no parsing or transformation.
  columns:
  - name: raw_data
    data_type: string
    description: Original Alpha Vantage JSON payload.
  - name: year
    data_type: int64
    description: Hive ingestion partition year.
  - name: month
    data_type: int64
    description: Hive ingestion partition month.
  - name: day
    data_type: int64
    description: Hive ingestion partition day.
