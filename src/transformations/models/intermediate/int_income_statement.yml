version: 2
models:
- name: int_income_statement
  description: |
    Silver layer for the Alpha Vantage INCOME_STATEMENT endpoint. Flattens the raw JSON payload into typed columns, deduplicates by most-recent ingestion date, and adds the derived field `ebitda_calc`. Grain: one row per (symbol, fiscaldateending, report_type).
  columns:
  - name: symbol
    data_type: string
    description: Stock ticker symbol identifying the company (e.g. IBM, AAPL).
    tests:
    - not_null
    config:
      meta:
        source_field: symbol
  - name: report_type
    data_type: string
    description: Report frequency — 'annual' (from annualReports) or 'quarterly' (from
      quarterlyReports).
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - annual
          - quarterly
  - name: fiscaldateending
    data_type: date
    description: Fiscal period end date parsed from fiscalDateEnding. Invalid dates
      remain NULL and fail the quality gate.
    tests:
    - not_null
    config:
      meta:
        source_field: fiscalDateEnding
  - name: fiscaldateending_raw
    data_type: string
    description: Original fiscalDateEnding string value before date parsing, preserved
      for audit purposes.
  - name: reportedcurrency
    data_type: string
    description: Currency in which financial figures are reported (e.g. USD).
    config:
      meta:
        source_field: reportedCurrency
  - name: gross_profit
    data_type: int64
    description: 'Gross profit: total revenue minus cost of revenue.'
    config:
      meta:
        source_field: grossProfit
  - name: total_revenue
    data_type: int64
    description: Total revenue for the period. Used as denominator for net_margin,
      ebitda_margin, and YoY growth.
    config:
      meta:
        source_field: totalRevenue
  - name: cost_of_revenue
    data_type: int64
    description: Cost of revenue (cost of goods sold).
    config:
      meta:
        source_field: costOfRevenue
  - name: operating_income
    data_type: int64
    description: Operating income (EBIT before D&A adjustments).
    config:
      meta:
        source_field: operatingIncome
  - name: selling_general_and_administrative
    data_type: int64
    description: Selling, general, and administrative expenses.
    config:
      meta:
        source_field: sellingGeneralAndAdministrative
  - name: research_and_development
    data_type: int64
    description: Research and development expenses.
    config:
      meta:
        source_field: researchAndDevelopment
  - name: operating_expenses
    data_type: int64
    description: Total operating expenses.
    config:
      meta:
        source_field: operatingExpenses
  - name: net_interest_income
    data_type: int64
    description: Net interest income (interest income minus interest expense).
    config:
      meta:
        source_field: netInterestIncome
  - name: interest_income
    data_type: int64
    description: Interest income earned.
    config:
      meta:
        source_field: interestIncome
  - name: interest_expense
    data_type: int64
    description: Interest expense paid.
    config:
      meta:
        source_field: interestExpense
  - name: depreciation_and_amortization
    data_type: int64
    description: Depreciation and amortization. Used as a component of ebitda_calc
      when ebitda is NULL.
    config:
      meta:
        source_field: depreciationAndAmortization
  - name: income_before_tax
    data_type: int64
    description: Earnings before income tax.
    config:
      meta:
        source_field: incomeBeforeTax
  - name: income_tax_expense
    data_type: int64
    description: Income tax expense for the period.
    config:
      meta:
        source_field: incomeTaxExpense
  - name: net_income_from_continuing_operations
    data_type: int64
    description: Net income from continuing operations only (excludes discontinued
      operations).
    config:
      meta:
        source_field: netIncomeFromContinuingOperations
  - name: ebit
    data_type: int64
    description: Earnings before interest and taxes. Used as a component of ebitda_calc.
    config:
      meta:
        source_field: ebit
  - name: ebitda
    data_type: int64
    description: Earnings before interest, taxes, depreciation, and amortization as
      reported by the API.
    config:
      meta:
        source_field: ebitda
  - name: net_income
    data_type: int64
    description: Net income for the period. Used in ROE, net_margin, and quality_of_earnings
      calculations.
    config:
      meta:
        source_field: netIncome
  - name: ebitda_calc
    data_type: int64
    description: |
      Derived EBITDA: COALESCE(ebitda, ebit + depreciation_and_amortization). Falls back to the component sum when the API does not provide ebitda directly. NULL when either fallback component is missing or their sum overflows.
  - name: ingest_date
    data_type: date
    description: Ingestion date derived from Hive partitions (DATE(partition_year,
      partition_month, partition_day)).
  - name: partition_year
    data_type: int64
    description: Year component of the GCS Hive partition.
  - name: partition_month
    data_type: int64
    description: Month component of the GCS Hive partition.
  - name: partition_day
    data_type: int64
    description: Day component of the GCS Hive partition.
  - name: cost_of_goods_and_services_sold
    data_type: int64
    description: Cost of goods and services sold from Alpha Vantage costofGoodsAndServicesSold.
      Missing, sentinel or invalid values become NULL.
    config:
      meta:
        source_field: costofGoodsAndServicesSold
  - name: investment_income_net
    data_type: int64
    description: Investment income net from Alpha Vantage investmentIncomeNet. Missing,
      sentinel or invalid values become NULL.
    config:
      meta:
        source_field: investmentIncomeNet
  - name: non_interest_income
    data_type: int64
    description: Non interest income from Alpha Vantage nonInterestIncome. Missing,
      sentinel or invalid values become NULL.
    config:
      meta:
        source_field: nonInterestIncome
  - name: other_non_operating_income
    data_type: int64
    description: Other non operating income from Alpha Vantage otherNonOperatingIncome.
      Missing, sentinel or invalid values become NULL.
    config:
      meta:
        source_field: otherNonOperatingIncome
  - name: depreciation
    data_type: int64
    description: Depreciation from Alpha Vantage depreciation. Missing, sentinel or
      invalid values become NULL.
    config:
      meta:
        source_field: depreciation
  - name: interest_and_debt_expense
    data_type: int64
    description: Interest and debt expense from Alpha Vantage interestAndDebtExpense.
      Missing, sentinel or invalid values become NULL.
    config:
      meta:
        source_field: interestAndDebtExpense
  - name: comprehensive_income_net_of_tax
    data_type: int64
    description: Comprehensive income net of tax from Alpha Vantage comprehensiveIncomeNetOfTax.
      Missing, sentinel or invalid values become NULL.
    config:
      meta:
        source_field: comprehensiveIncomeNetOfTax
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - symbol
        - fiscaldateending
        - report_type
unit_tests:
- name: income_statement_latest_ingestion_and_frequency
  model: int_income_statement
  given:
  - input: ref('stg_income_statement')
    format: sql
    rows: |-
      select '{"symbol":"TEST","annualReports":[{"fiscalDateEnding":"2025-12-31","reportedCurrency":"USD","totalRevenue":"100"}],"quarterlyReports":[{"fiscalDateEnding":"2025-12-31","reportedCurrency":"USD","totalRevenue":"100"}]}' as raw_data, 2026 as year, 9 as month, 7 as day
      union all
      select '{"symbol":"TEST","annualReports":[{"fiscalDateEnding":"2025-12-31","reportedCurrency":"USD","totalRevenue":"200"}],"quarterlyReports":[]}' as raw_data, 2026 as year, 9 as month, 8 as day
  expect:
    rows:
    - symbol: TEST
      fiscaldateending: '2025-12-31'
      report_type: annual
      total_revenue: 200
      ingest_date: '2026-09-08'
    - symbol: TEST
      fiscaldateending: '2025-12-31'
      report_type: quarterly
      total_revenue: 100
      ingest_date: '2026-09-07'
- name: income_statement_invalid_fields_are_retained
  model: int_income_statement
  given:
  - input: ref('stg_income_statement')
    format: sql
    rows: select '{"symbol":"TEST","annualReports":[{"fiscalDateEnding":"2025-01-28","totalRevenue":"None"},{"fiscalDateEnding":"2025-02-28","totalRevenue":"-"},{"fiscalDateEnding":"2025-03-28","totalRevenue":"N/A"},{"fiscalDateEnding":"2025-04-28","totalRevenue":""},{"fiscalDateEnding":"2025-05-28","totalRevenue":"bad-number"},{"fiscalDateEnding":"2025-06-28","totalRevenue":"9223372036854775808"},{"fiscalDateEnding":"broken-date","totalRevenue":"42"}],"quarterlyReports":[]}'
      as raw_data, 2026 as year, 9 as month, 8 as day
  expect:
    rows:
    - fiscaldateending: '2025-01-28'
      total_revenue: null
      fiscaldateending_raw: '2025-01-28'
    - fiscaldateending: '2025-02-28'
      total_revenue: null
      fiscaldateending_raw: '2025-02-28'
    - fiscaldateending: '2025-03-28'
      total_revenue: null
      fiscaldateending_raw: '2025-03-28'
    - fiscaldateending: '2025-04-28'
      total_revenue: null
      fiscaldateending_raw: '2025-04-28'
    - fiscaldateending: '2025-05-28'
      total_revenue: null
      fiscaldateending_raw: '2025-05-28'
    - fiscaldateending: '2025-06-28'
      total_revenue: null
      fiscaldateending_raw: '2025-06-28'
    - fiscaldateending: null
      total_revenue: 42
      fiscaldateending_raw: broken-date
- name: income_statement_empty_arrays
  model: int_income_statement
  given:
  - input: ref('stg_income_statement')
    format: sql
    rows: select '{"symbol":"TEST","annualReports":[],"quarterlyReports":[]}' as raw_data,
      2026 as year, 9 as month, 8 as day
  expect:
    rows: []
- name: income_statement_derived_components
  model: int_income_statement
  given:
  - input: ref('stg_income_statement')
    format: sql
    rows: select '{"symbol":"TEST","annualReports":[{"fiscalDateEnding":"2025-01-28","ebitda":"150","ebit":"80","depreciationAndAmortization":"20"},{"fiscalDateEnding":"2025-02-28","ebitda":"None","ebit":"80","depreciationAndAmortization":"20"},{"fiscalDateEnding":"2025-03-28","ebit":"80"},{"fiscalDateEnding":"2025-04-28","ebit":"9223372036854775807","depreciationAndAmortization":"1"}],"quarterlyReports":[]}'
      as raw_data, 2026 as year, 9 as month, 8 as day
  expect:
    rows:
    - fiscaldateending: '2025-01-28'
      ebitda_calc: 150
    - fiscaldateending: '2025-02-28'
      ebitda_calc: 100
    - fiscaldateending: '2025-03-28'
      ebitda_calc: null
    - fiscaldateending: '2025-04-28'
      ebitda_calc: null
