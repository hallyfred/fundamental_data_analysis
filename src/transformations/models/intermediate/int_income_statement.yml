      operating_expenses: 1010
      investment_income_net: 1011
      net_interest_income: 1012
      interest_income: 1013
      interest_expense: 1014
      non_interest_income: 1015
      other_non_operating_income: 1016
      depreciation: 1017
      depreciation_and_amortization: 1018
      income_before_tax: 1019
      income_tax_expense: 1020
