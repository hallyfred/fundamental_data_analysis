version: 2

sources:
  - name: bronze
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: alphavantage
    tables:
      - name: ext_overview
        description: "External table pointing to Alpha Vantage overview JSON files."
        external:
          # Parse each JSON document as one CSV field.
          options:
            format: CSV
            field_delimiter: "\x01"  # Delimiter chosen to avoid splitting JSON content.
            quote: ""                # Disable CSV quote parsing to preserve JSON strings.
            uris: 
              - "gs://{{ env_var('BUCKET_BRONZE') }}/financial/overview/year=*"
            hive_partition_uri_prefix: "gs://{{ env_var('BUCKET_BRONZE') }}/financial/overview"
          partitions:
            - name: year
              data_type: INT64
            - name: month
              data_type: INT64
            - name: day
              data_type: INT64
        
        columns:
          - name: raw_data
            data_type: STRING

      - name: ext_balance_sheet
