version: '3.8'

services:
  airflow-webserver:
    build: .
    container_name: fundamental_airflow_webserver
    command: webserver
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'X6iQ2ZxD0Nn2Y3nv7wZ8kH1dYQ8q1lW7kqc4Fj4d6I8='
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      PYTHONPATH: /opt/airflow
    volumes:
      - .:/opt/airflow
      - ./config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./src/transformations:/opt/airflow/src/transformations
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  airflow-scheduler:
    build: .
    container_name: fundamental_airflow_scheduler
    command: scheduler
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: 'X6iQ2ZxD0Nn2Y3nv7wZ8kH1dYQ8q1lW7kqc4Fj4d6I8='
      PYTHONPATH: /opt/airflow
    volumes:
      - .:/opt/airflow
      - ./config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./src/transformations:/opt/airflow/src/transformations
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: fundamental_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
