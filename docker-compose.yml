x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-airflow-image: &airflow-image
  build: .
  image: fundamental-airflow:2.9.3

services:
  airflow-init:
    <<: *airflow-image
    container_name: fundamental_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${_AIRFLOW_WWW_USER_EMAIL}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" || \
        airflow users reset-password \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}"
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres/airflow"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY must be set in .env}"
      _AIRFLOW_WWW_USER_USERNAME: "${_AIRFLOW_WWW_USER_USERNAME:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${_AIRFLOW_WWW_USER_PASSWORD:?_AIRFLOW_WWW_USER_PASSWORD must be set in .env}"
      _AIRFLOW_WWW_USER_EMAIL: "${_AIRFLOW_WWW_USER_EMAIL:-admin@localhost}"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  airflow-webserver:
    <<: *airflow-image
    container_name: fundamental_airflow_webserver
    command: webserver
    restart: always
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres/airflow"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY must be set in .env}"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/opt/airflow/gcp_key.json}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set in .env}"
      BUCKET_BRONZE: "${BUCKET_BRONZE:?BUCKET_BRONZE must be set in .env}"
      DBT_TARGET: "${DBT_TARGET:-prod}"
      # --- Opção B: tuning de memória ---
      AIRFLOW__WEBSERVER__WORKERS: '2'
      AIRFLOW__WEBSERVER__WORKER_TIMEOUT: '120'
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'True'
      AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: 'True'
      # Cosmos telemetry is optional and must not affect pipeline availability.
      AIRFLOW__COSMOS__ENABLE_TELEMETRY: 'False'
    volumes:
      - ./config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gcp_key.json:/opt/airflow/gcp_key.json:ro
      - ./logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  airflow-scheduler:
    <<: *airflow-image
    container_name: fundamental_airflow_scheduler
    command: scheduler
    restart: always
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres/airflow"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY must be set in .env}"
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/opt/airflow/gcp_key.json}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:?GCP_PROJECT_ID must be set in .env}"
      BUCKET_BRONZE: "${BUCKET_BRONZE:?BUCKET_BRONZE must be set in .env}"
      DBT_TARGET: "${DBT_TARGET:-prod}"
      # --- Opção B: tuning de memória ---
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
      AIRFLOW__CORE__LAZY_LOAD_PLUGINS: 'True'
      AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: 'True'
      # Prevent optional Cosmos telemetry failures from restarting the scheduler.
      AIRFLOW__COSMOS__ENABLE_TELEMETRY: 'False'
    volumes:
      - ./config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gcp_key.json:/opt/airflow/gcp_key.json:ro
      - ./logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging: *default-logging

  postgres:
    image: postgres:15
    container_name: fundamental_postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:

